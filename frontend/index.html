<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Story-pix — Turn photos into living stories with interactive WebAR albums" />
    <meta name="theme-color" content="#8A2BE2" />
    <title>Story-pix</title>
    <style>
      /* Critical guest viewer layout — must load before JS/CSS bundles (mobile Safari). */
      html.viewer-route,
      html.viewer-route body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #000;
        color: #fff;
      }
      html.viewer-route #root,
      html.viewer-route .viewer-shell,
      html.viewer-route .viewer-intro,
      html.viewer-route .ar-viewer-root {
        position: fixed;
        inset: 0;
        width: 100%;
        width: 100vw;
        height: 100%;
        height: 100dvh;
        min-width: 100vw;
        min-height: 100dvh;
        overflow: hidden;
      }
      html.viewer-route .viewer-intro {
        z-index: 2;
        display: flex;
        flex-direction: column;
        border: 0;
        padding: 0;
        background: linear-gradient(180deg, #1a0a2e 0%, #120818 48%, #000 100%);
      }
      html.viewer-route .ar-scene-host {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html.viewer-route video.ar-camera-feed,
      html.viewer-route .ar-viewer-root > video:not(#sp-mapped-video) {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        object-fit: cover !important;
        transform: none !important;
        z-index: 1 !important;
      }
      html.viewer-route .ar-scene-host canvas,
      html.viewer-route .ar-scene-host .a-canvas {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      #viewer-boot {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: linear-gradient(180deg, #1a0a2e 0%, #120818 45%, #000 100%);
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      html.viewer-route #viewer-boot {
        display: flex;
      }
      #viewer-boot .boot-logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: linear-gradient(135deg, #8a2be2, #ff4fa3);
        box-shadow: 0 8px 32px rgba(138, 43, 226, 0.35);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #viewer-boot p {
        margin: 0;
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.75);
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }

      /* On-screen debug — inline in HTML so it shows before React bundles load. */
      #sp-viewer-debug {
        display: none;
        position: fixed;
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        z-index: 2147483647;
        pointer-events: auto;
        flex-direction: column;
        max-height: min(44vh, 340px);
        border: 3px solid #ff4fa3;
        border-radius: 12px;
        background: rgba(6, 6, 12, 0.96);
        color: #eef2ff;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
      }
      html.viewer-route #sp-viewer-debug {
        display: flex !important;
      }
      #sp-viewer-debug.sp-viewer-debug--min {
        max-height: none;
        height: auto;
      }
      #sp-viewer-debug.sp-viewer-debug--min #sp-viewer-debug-body {
        display: none;
      }
      #sp-viewer-debug-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.4rem;
        padding: 0.45rem 0.55rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(138, 43, 226, 0.35);
        flex-shrink: 0;
      }
      #sp-viewer-debug-title {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #sp-viewer-debug-actions {
        display: inline-flex;
        gap: 0.3rem;
        flex-shrink: 0;
      }
      #sp-viewer-debug-actions button {
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        padding: 0.28rem 0.5rem;
        font: inherit;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      #sp-viewer-debug-body {
        margin: 0;
        padding: 0.4rem 0.5rem 0.55rem;
        overflow: auto;
        flex: 1 1 auto;
        min-height: 72px;
        max-height: min(36vh, 280px);
        white-space: pre-wrap;
        word-break: break-word;
      }
      #sp-viewer-debug-body .sp-log-error { color: #ff8a8a; }
      #sp-viewer-debug-body .sp-log-warn { color: #ffd27a; }
      #sp-viewer-debug-body .sp-log-info { color: #e8ecff; }
      #sp-viewer-debug-body .sp-log-debug { color: rgba(200, 210, 255, 0.78); }
    </style>
    <script>
      (function () {
        var isViewer = /^\/viewer\/[^/]+/.test(location.pathname);
        if (!isViewer) return;

        document.documentElement.classList.add('viewer-route');

        var DEBUG_BUILD = '2026-08-29-c';
        var lines = [];
        var bodyEl = null;
        var titleEl = null;
        var panelEl = null;
        var maxLines = 500;

        function pad(n) {
          return n < 10 ? '0' + n : String(n);
        }

        function formatTime(at) {
          var d = new Date(at);
          return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        }

        function renderTitle() {
          if (titleEl) {
            titleEl.textContent = 'Debug ' + DEBUG_BUILD + ' · ' + lines.length + ' lines';
          }
        }

        function appendLine(level, message) {
          var at = Date.now();
          var row = formatTime(at) + ' [' + level + '] ' + message;
          lines.push(row);
          if (lines.length > maxLines) lines.splice(0, lines.length - maxLines);
          if (bodyEl) {
            var span = document.createElement('div');
            span.className = 'sp-log-' + level;
            span.textContent = row;
            bodyEl.appendChild(span);
            bodyEl.scrollTop = bodyEl.scrollHeight;
          }
          renderTitle();
        }

        function flushLinesToDom() {
          if (!bodyEl) return;
          bodyEl.textContent = '';
          for (var i = 0; i < lines.length; i++) {
            var span = document.createElement('div');
            span.textContent = lines[i];
            bodyEl.appendChild(span);
          }
          bodyEl.scrollTop = bodyEl.scrollHeight;
        }

        function initPanel() {
          panelEl = document.getElementById('sp-viewer-debug');
          bodyEl = document.getElementById('sp-viewer-debug-body');
          titleEl = document.getElementById('sp-viewer-debug-title');
          if (!panelEl || !bodyEl) return;

          document.getElementById('sp-viewer-debug-share').addEventListener('click', function () {
            var text = lines.join('\n');
            if (navigator.share) {
              navigator.share({ title: 'Story-pix debug log', text: text }).catch(function () {});
              return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).catch(function () {
                window.prompt('Copy debug log', text);
              });
              return;
            }
            window.prompt('Copy debug log', text);
          });

          document.getElementById('sp-viewer-debug-clear').addEventListener('click', function () {
            lines.length = 0;
            bodyEl.textContent = '';
            renderTitle();
            appendLine('info', 'Log cleared');
          });

          document.getElementById('sp-viewer-debug-min').addEventListener('click', function () {
            panelEl.classList.toggle('sp-viewer-debug--min');
          });

          renderTitle();
          flushLinesToDom();
          appendLine('info', 'HTML debug panel ready · ' + location.pathname);
        }

        window.__spViewerDebugPush = function (level, message) {
          appendLine(level || 'info', String(message));
        };
        window.__spViewerDebugClear = function () {
          lines.length = 0;
          if (bodyEl) bodyEl.textContent = '';
          renderTitle();
        };

        window.addEventListener('error', function (event) {
          appendLine('error', 'early error: ' + event.message);
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          appendLine(
            'error',
            'early rejection: ' + (reason && reason.message ? reason.message : String(reason)),
          );
        });

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initPanel);
        } else {
          initPanel();
        }

        // Preload only — do NOT execute in parallel.
        // mindar-image-aframe requires window.AFRAME; async parallel load causes
        // "Uncaught ReferenceError: AFRAME is not defined".
        var scripts = [
          '/ar/mindar-image.prod.js',
          '/ar/aframe.min.js',
          '/ar/mindar-image-aframe.prod.js',
        ];

        scripts.forEach(function (src) {
          var preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'script';
          preload.href = src;
          document.head.appendChild(preload);
        });

        // Load strictly in order (no async).
        var i = 0;
        function next() {
          if (i >= scripts.length) return;
          var src = scripts[i++];
          var tag = document.createElement('script');
          tag.src = src;
          tag.async = false;
          tag.onload = next;
          tag.onerror = next;
          document.head.appendChild(tag);
        }
        next();
      })();
    </script>
  </head>
  <body>
    <div id="viewer-boot" aria-hidden="true">
      <div class="boot-logo"></div>
      <p>Opening your album…</p>
    </div>
    <div id="sp-viewer-debug" aria-live="polite" aria-label="Viewer debug log">
      <div id="sp-viewer-debug-header">
        <span id="sp-viewer-debug-title">Debug</span>
        <div id="sp-viewer-debug-actions">
          <button type="button" id="sp-viewer-debug-share">Share</button>
          <button type="button" id="sp-viewer-debug-clear">Clear</button>
          <button type="button" id="sp-viewer-debug-min">Min</button>
        </div>
      </div>
      <pre id="sp-viewer-debug-body"></pre>
    </div>
    <div id="root"></div>
    <script type="module">
      const isViewer = /^\/viewer\/[^/]+/.test(location.pathname);
      if (isViewer) {
        import('/src/viewer-main.tsx');
      } else {
        import('/src/main.tsx');
      }
    </script>
  </body>
</html>
